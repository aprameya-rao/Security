version: '3.8'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Set BRAIN_IP in .env (copy from .env.example) to this VM's address.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${BRAIN_IP:-192.168.1.16}:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native interface
    environment:
      CLICKHOUSE_DB: security_logs
      CLICKHOUSE_PASSWORD: admin
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "admin", "-q", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

  ioc-feed:
    image: python:3.11-slim
    container_name: ioc-feed
    depends_on:
      - redis
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      IOC_REFRESH_HOURS: "${IOC_REFRESH_HOURS:-1}"
      IOC_FEEDS: "${IOC_FEEDS:-local,urlhaus,feodo,threatfox}"
      THREATFOX_API_KEY: "${THREATFOX_API_KEY:-}"
    working_dir: /app
    volumes:
      - ./ioc_feed.py:/app/ioc_feed.py:ro
      - ./iocs:/app/iocs:ro
    command: sh -c "pip install --no-cache-dir redis && python ioc_feed.py --refresh"

  ioc-learner:
    image: python:3.11-slim
    container_name: ioc-learner
    depends_on:
      - kafka
      - redis
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      IOC_ACK_TOPIC: kill_confirmations
      REINFECT_WINDOW_S: "${REINFECT_WINDOW_S:-300}"
      REINFECT_KILLS: "${REINFECT_KILLS:-2}"
    working_dir: /app
    volumes:
      - ./ioc_learner.py:/app/ioc_learner.py:ro
    command: sh -c "pip install --no-cache-dir redis confluent-kafka && python ioc_learner.py"

volumes:
  clickhouse-data:
